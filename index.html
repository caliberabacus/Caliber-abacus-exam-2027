<style>

.attempt{border-bottom:1px solid #eee;padding:12px 0}.attempt:last-child{border:0}.attempt-row{display:flex;justify-content:space-between;align-items:center}.review-btn{border:1.5px solid #2563eb;color:#2563eb;background:#fff;padding:6px 10px;border-radius:4px;font-size:12px}

.gate{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:200;padding:16px}.gateBox{background:#fff;border-radius:12px;padding:16px;width:100%;max-width:360px}.gateBox input{margin-top:8px}
