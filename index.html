<!DOCTYPE html>
<html lang="te"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CALIBER ABACUS - Exam 2027</title>
<style>
*{box-sizing:border-box;font-family:Arial}body{margin:0;background:#fff7ed}
.top{background:#1e293b;color:#fff;padding:14px;text-align:center}
.top b{font-size:20px}.top span{font-size:12px;color:#fbbf24}
.card{max-width:520px;margin:14px auto;background:#fff;padding:16px;border-radius:14px;box-shadow:0 4px 14px #0001}
input{width:100%;padding:13px;margin:8px 0;border:2px solid #ddd;border-radius:10px;font-size:16px}
button{width:100%;padding:13px;border:0;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer}
.btn-green{background:#16a34a;color:#fff}.btn-orange{background:#f97316;color:#fff}.btn-dark{background:#1e293b;color:#fff;margin-top:8px}
.timer{background:#dc2626;color:#fff;text-align:center;padding:10px;border-radius:10px;font-weight:700}
.qnums{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}.qnums div{width:32px;height:32px;border-radius:50%;background:#e5e7eb;display:flex;align-items:center;justify-content:center;font-size:13px}
.qnums .done{background:#22c55e;color:#fff}.qnums .now{border:2px solid #000}
.qbox{font-size:22px;font-weight:700;margin:14px 0}
#cam{position:fixed;top:8px;right:8px;width:82px;height:82px;border-radius:50%;border:3px solid #facc15;object-fit:cover;z-index:99;background:#000;display:none}
#camLabel{position:fixed;top:92px;right:8px;font-size:10px;background:#16a34a;color:#fff;padding:2px 6px;border-radius:20px;z-index:99;display:none}
.level{padding:14px;border-radius:12px;margin:8px 0;color:#fff;font-weight:700;cursor:pointer}
.hidden{display:none}.small{font-size:12px;color:#666;text-align:center;margin-top:10px}
</style></head><body>
<video id="cam" autoplay muted playsinline></video><div id="camLabel">● CAM ON</div>
<div class="top"><b>🧮 CALIBER ABACUS</b><br><span>ALL Exams - One Link | KID to LEVEL 5</span></div>

<!-- LOGIN -->
<div class="card" id="loginBox">
<h2 style="text-align:center;margin:4px">Login</h2>
<p style="text-align:center;font-size:13px;color:#666">Student ID = Password</p>
<input id="u" placeholder="Username - Ex: NV0001">
<input id="p" type="password" placeholder="Password - Ex: NV0001">
<button class="btn-green" onclick="login()">Login →</button>
<p class="small">Demo: NV0001 / NV0001 &nbsp;|&nbsp; Teacher: KSK / 2013<br>NV5001 / NV5001 - Level 5</p>
</div>

<!-- LEVELS -->
<div class="card hidden" id="levelBox">
<h3 id="welcome"></h3>
<p style="font-size:13px;color:#666">Level Select Cheyandi - Demo 50 Qs - Final 50 Qs</p>
<div id="levels"></div>
<button class="btn-dark" onclick="logout()">Logout</button>
</div>

<!-- EXAM -->
<div class="card hidden" id="examBox">
<div class="timer" id="timer"></div>
<div class="qnums" id="qnums"></div>
<div class="qbox" id="qtext"></div>
<input id="ans" inputmode="numeric" placeholder="Answer - Number Only">
<button class="btn-green" onclick="saveNext()">Save & Next →</button>
<button class="btn-orange" style="margin-top:8px" onclick="submitExam()">✅ Submit</button>
<button class="btn-dark" onclick="backLevels()">← Back to All Levels</button>
<p class="small" id="result"></p>
</div>

<script>
let users={"NV0001":"U.LAKSHMI SAHANA","NV0002":"K.MAANVI","NV0003":"K.POORNA VAISHNAVI","NV5001":"B.ABHINAV","KSK":"TEACHER - KSK"};
let curUser="",curLevel="",qs=[],idx=0,answers={},timerInt=null,left=0;
function login(){
 let u=document.getElementById('u').value.trim().toUpperCase();
 let p=document.getElementById('p').value.trim();
 if((u==="KSK"&&p==="2013")||(users[u]&&p===u)){
  curUser=u; document.getElementById('loginBox').classList.add('hidden');
  document.getElementById('levelBox').classList.remove('hidden');
  document.getElementById('welcome').innerText="Welcome "+users[u]+" - "+(u==="KSK"?"TEACHER":u);
  showLevels();
 } else alert("Wrong Username / Password!");
}
function logout(){location.reload()}
function showLevels(){
 let lv=[["KID","KID LEVEL - 50 Qs - 10 Min","#22c55e"],["LEVEL 1","LEVEL 1 - 50 Qs - 10 Min","#16a34a"],["LEVEL 2","LEVEL 2 - 50 Qs - 10 Min","#2563eb"],["LEVEL 3","LEVEL 3 - 50 Qs - 10 Min","#f59e0b"],["LEVEL 4","LEVEL 4 - 50 Qs - 12 Min","#ef4444"],["LEVEL 5","LEVEL 5 - 50 Qs - 12 Min","#9333ea"]];
 document.getElementById('levels').innerHTML=lv.map(x=>`<div class="level" style="background:${x[2]}" onclick="startExam('${x[0]}')">${x[1]} →</div>`).join('');
}
function genQs(level){
 let set=new Set(),arr=[];
 let max=level==="KID"?10:level==="LEVEL 1"?20:level==="LEVEL 2"?50:level==="LEVEL 3"?100:200;
 while(arr.length<50){
  let a=Math.floor(Math.random()*max)+1, b=Math.floor(Math.random()*max)+1, c=Math.floor(Math.random()*9)+1;
  let q,ans;
  if(level==="KID"){q=`${a} + ${b} = ?`; ans=a+b;}
  else if(level==="LEVEL 1"){q=`${a} + ${b} + ${c} = ?`; ans=a+b+c;}
  else if(level==="LEVEL 2"){q=`${a} + ${b} - ${c} = ?`; ans=a+b-c;}
  else if(level==="LEVEL 3"){q=`${a} + ${b} + ${c} - ${a} = ?`; ans=b+c;}
  else {q=`${a} x ${c} + ${b} = ?`; ans=a*c+b;}
  let key=q; if(set.has(key)) continue; set.add(key); arr.push({q,ans});
 }
 return arr;
}
function startExam(level){
 curLevel=level; qs=genQs(level); idx=0; answers={};
 left=(level==="LEVEL 4"||level==="LEVEL 5")?12*60:10*60;
 document.getElementById('levelBox').classList.add('hidden');
 document.getElementById('examBox').classList.remove('hidden');
 document.getElementById('result').innerText="";
 startCamera(); render(); startTimer();
}
function startCamera(){
 let v=document.getElementById('cam');
 v.style.display="block"; document.getElementById('camLabel').style.display="block";
 if(navigator.mediaDevices) navigator.mediaDevices.getUserMedia({video:true}).then(s=>v.srcObject=s).catch(e=>{});
}
function render(){
 document.getElementById('qnums').innerHTML=qs.map((_,i)=>`<div class="${answers[i]!=null?'done':''} ${i===idx?'now':''}" onclick="goQ(${i})">${i+1}</div>`).join('');
 document.getElementById('qtext').innerText=`Q${idx+1}: ${qs[idx].q}`;
 document.getElementById('ans').value=answers[idx]??""; document.getElementById('ans').focus();
}
function goQ(i){saveAns(); idx=i; render();}
function saveAns(){let v=document.getElementById('ans').value.trim(); if(v!=="") answers[idx]=v;}
function saveNext(){saveAns(); if(idx<49){idx++; render();} else alert("Last Question - Submit nokkandi!");}
function startTimer(){
 clearInterval(timerInt);
 timerInt=setInterval(()=>{left--; let m=Math.floor(left/60), s=left%60;
  document.getElementById('timer').innerText=`⏰ Time Left: ${m}:${s<10?'0':''}${s} - ${curLevel} - Total 50`;
  if(left<=0){clearInterval(timerInt); submitExam(true);}
 },1000);
}
function submitExam(auto=false){
 saveAns(); clearInterval(timerInt);
 let correct=0; qs.forEach((q,i)=>{if(parseInt(answers[i])===q.ans) correct++;});
 document.getElementById('result').innerHTML=`🎉 ${auto?"Time Aypoyindhi! ":""} Result: ${correct} / 50 - ${correct>=35?"PASS ✅":"Try Again"}`;
 alert(`Result: ${correct} / 50`);
}
function backLevels(){clearInterval(timerInt); document.getElementById('cam').style.display="none"; document.getElementById('camLabel').style.display="none"; document.getElementById('examBox').classList.add('hidden'); document.getElementById('levelBox').classList.remove('hidden');}
</script></body></html>
