<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Caliber Abacus Exam 2027</title><style>body{font-family:Arial;margin:0;background:#FFF7ED}.top{background:#FF6B00;color:#fff;padding:14px;text-align:center}.top h1{margin:0;font-size:22px}.top p{margin:4px;font-size:13px}.box{background:#fff;margin:10px;padding:14px;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.08)}input{width:90%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:8px}.btn{display:block;background:#FF6B00;color:#fff;text-align:center;padding:12px;border-radius:10px;font-weight:800;text-decoration:none;margin-top:10px}.btn2{background:#1AAB00}.pal{display:flex;gap:6px;flex-wrap:wrap}.pal button{width:36px;height:36px;border-radius:50%;border:1px solid #ccc;background:#fff}.pal .cur{outline:3px solid #111827}.pal .done{background:#FFD400;border:2px solid #111827}</style></head><body><div class="top"><h1>CALIBER ABACUS</h1><p>Exam 2027 | Online Exam</p></div><div class="box" id="login"><h2>Student Login</h2><input id="name" placeholder="Student Name"><input id="roll" placeholder="Roll Number"><a class="btn" href="javascript:void(0)" onclick="start()">START EXAM</a></div><div class="box" id="exam" style="display:none"><p><b id="timer">Time: 20:00</b> | <b id="qno"></b></p><div><b id="qtext"></b><br><input id="ans" placeholder="Enter Answer" type="number"></div><div class="pal" id="pal"></div><a class="btn" href="javascript:void(0)" onclick="next()">NEXT / SAVE</a><a class="btn btn2" href="javascript:void(0)" onclick="finish()">SUBMIT EXAM</a></div><div class="box" id="result" style="display:none"><h2>Result</h2><p id="rtext"></p><a class="btn" href="javascript:void(0)" onclick="location.reload()">RESTART</a></div><script>let Q=[],C=[],U=[],cur=0,t=20*60;for(let i=0;i<20;i++){let a=Math.floor(Math.random()*80)+10,b=Math.floor(Math.random()*40)+10;Q.push(a+" + "+b+" = ?");C.push(a+b)}function start(){if(!name.value||!roll.value){alert("Enter Name & Roll");return}login.style.display="none";exam.style.display="block";show();setInterval(()=>{t--;let m=Math.floor(t/60),s=t%60;timer.innerText="Time: "+m+":"+(s<10?"0":"")+s;if(t<=0)finish()},1000)}function show(){qno.innerText="Q "+(cur+1)+"/20";qtext.innerText="Q"+(cur+1)+". "+Q[cur];ans.value=U[cur]||"";pal.innerHTML="";for(let i=0;i<20;i++){let b=document.createElement("button");b.innerText=i+1;if(i==cur)b.className="cur";if(U[i]!=null)b.className+=" done";b.onclick=(()=>{let k=i;return()=>{save();cur=k;show()}})();pal.appendChild(b)}}function save(){if(ans.value!="")U[cur]=Number(ans.value)}function next(){save();if(cur<19){cur++;show()}}function finish(){save();let c=0;for(let i=0;i<20;i++)if(U[i]==C[i])c++;exam.style.display="none";result.style.display="block";rtext.innerHTML=name.value+" ("+roll.value+")<br>Score: "+c+"/20<br>"+(c>=10?"PASS - Super!":"Try Again!")}</script></body></html>
