<!DOCTYPE html>
<html lang="te"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>CALIBER ABACUS - Exam 2027</title>
<style>
*{box-sizing:border-box;font-family:Arial}body{margin:0;background:#f1f5f9;overflow:hidden}
.topbar{background:#fff;border-bottom:1px solid #ddd;padding:8px 10px;display:flex;justify-content:space-between;font-size:12px;font-weight:700}
.topbar span{color:#2563eb}.timer{color:#dc2626!important}
.card{max-width:640px;margin:8px auto;background:#fff;border-radius:10px;padding:10px;box-shadow:0 2px 8px #0001}
input{width:100%;padding:10px;border:2px solid #999;border-radius:6px;font-size:22px;text-align:center;font-weight:800;font-family:'Segoe UI',Roboto,Arial,sans-serif}
button{border:0;border-radius:6px;font-weight:700;cursor:pointer}
.qnums{display:flex;gap:5px;overflow-x:auto;padding:6px 0;scrollbar-width:none}.qnums::-webkit-scrollbar{display:none}
.qnums div{min-width:28px;height:28px;border-radius:50%;background:#fecaca;color:#991b1b;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.qnums .done{background:#22c55e;color:#fff}.qnums .review{background:#a855f7;color:#fff}.qnums .now{border:2px solid #000}
.legend{display:flex;gap:6px;font-size:10px}.legend span{padding:2px 6px;border-radius:12px;color:#fff;font-weight:700}
.exam-main{display:flex;gap:8px;margin-top:8px}
/* NUMBERS - MOBILE KEYBOARD LAGA CLEAR GA */
.qbox{width:92px;min-height:210px;border:1.5px solid #000;background:#ffffff;display:flex;align-items:center;justify-content:center;text-align:center;flex-shrink:0;border-radius:4px}
.qbox pre{font-family:'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:42px;line-height:1.3;margin:0;font-weight:800;color:#000;letter-spacing:1px;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.qbox.horizontal{width:160px}.qbox.horizontal pre{font-size:28px;line-height:1.3}
.right{flex:1;display:flex;flex-direction:column;gap:8px}
.keypad{border:1px solid #ddd;padding:8px;background:#fff;border-radius:6px;width:195px;margin:0 auto}
.keypad .khead{background:#eee;text-align:center;font-size:12px;padding:4px;font-weight:700}
.keypad-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;margin-top:4px}
.keypad-grid button{background:#fff;border:1px solid #999;padding:11px;font-size:21px;font-weight:800;font-family:'Segoe UI',Roboto,Arial,sans-serif;color:#000;border-radius:4px}
.keypad-grid button:active{background:#dbeafe}
.keypad .clearBtn{background:#fff;border:1px solid #999;padding:5px;font-size:12px;width:100%;margin-top:4px}
.bottom-bar{display:flex;gap:6px;margin-top:10px}.bottom-bar button{flex:1;padding:12px;font-size:13px}
.btn-blue{background:#2563eb;color:#fff}.btn-grey{background:#e5e7eb;color:#333}.btn-orange{background:#f97316;color:#fff}
#cam{position:fixed;top:48px;right:8px;width:62px;height:62px;border-radius:50%;border:3px solid #facc15;object-fit:cover;z-index:99;background:#000;display:none}
#camLabel{position:fixed;top:112px;right:8px;font-size:9px;background:#16a34a;color:#fff;padding:2px 5px;border-radius:20px;z-index:99;display:none}
.level{padding:14px;border-radius:12px;margin:8px 0;color:#fff;font-weight:700;cursor:pointer}
.hidden{display:none}.small{font-size:12px;color:#666;text-align:center}
#examBox{height:calc(100vh - 20px);overflow:hidden}
</style></head><body>
<video id="cam" autoplay muted playsinline></video><div id="camLabel">● CAM ON</div>
<div class="card" id="loginBox"><h2 style="text-align:center;margin:4px">🧮 CALIBER ABACUS</h2><p style="text-align:center;font-size:13px;color:#666">Student ID = Password</p><input id="u" placeholder="Username - Ex: NV0001"><input id="p" type="password" placeholder="Password - Ex: NV0001" style="margin-top:8px"><button onclick="login()" style="background:#16a34a;color:#fff;padding:13px;width:100%;margin-top:8px;font-size:16px">Login →</button><p class="small" style="margin-top:8px">Demo: NV0001 / NV0001 | Teacher: KSK / 2013</p></div>
<div class="card hidden" id="levelBox"><h3 id="welcome"></h3><div id="levels"></div><button onclick="logout()" style="background:#1e293b;color:#fff;padding:12px;width:100%;margin-top:8px">Logout</button></div>

<div class="card hidden" id="examBox">
<div class="topbar"><span id="examTitle">Final NOV 2026 - Level - 0</span><span class="timer" id="timer">Time Left: 10:00</span></div>
<div style="font-size:11px;padding:6px 0;border-bottom:1px solid #eee"><b>Section</b> &nbsp; <span style="background:#2563eb;color:#fff;padding:2px 8px;border-radius:4px" id="secLabel">Level 0</span><span style="float:right">Mark/s: 2.00 | Negative Mark/s: 0.00</span></div>
<div class="legend" style="margin-top:6px"><span style="background:#22c55e">● Answered</span><span style="background:#ef4444">● Not Answered</span><span style="background:#a855f7">● Review</span></div>
<div class="qnums" id="qnums"></div>
<div style="font-size:12px;margin:4px 0">Question Type: NAT<br><b id="qNo">Question No. 1</b> <span id="totalQ" style="color:#666"></span></div>

<div class="exam-main">
  <div class="qbox" id="qbox"><pre id="qtext"></pre></div>
  <div class="right">
    <input id="ans" readonly placeholder="Answer">
    <div class="keypad">
      <div class="khead">Backspace</div>
      <div class="keypad-grid">
        <button onclick="press('7')">7</button><button onclick="press('8')">8</button><button onclick="press('9')">9</button>
        <button onclick="press('4')">4</button><button onclick="press('5')">5</button><button onclick="press('6')">6</button>
        <button onclick="press('1')">1</button><button onclick="press('2')">2</button><button onclick="press('3')">3</button>
        <button onclick="press('0')">0</button><button onclick="press('.')">.</button><button onclick="press('-')">-</button>
        <button onclick="backspace()">←</button><button onclick="clearAns()">C</button><button onclick="press('')">_</button>
      </div>
      <button class="clearBtn" onclick="clearAns()">Clear All</button>
    </div>
  </div>
</div>

<div class="bottom-bar"><button class="btn-blue" onclick="saveNext()" style="padding:13px">Save and Next →</button></div>
<div class="bottom-bar">
  <button class="btn-orange" onclick="submitExam()">Submit Exam</button>
  <button class="btn-grey" onclick="markReview()">🟣 Mark as Review</button>
</div>
<p class="small" id="result"></p>
<button onclick="backLevels()" style="background:#1e293b;color:#fff;padding:8px;width:100%;margin-top:6px;font-size:12px">← Back to All Levels</button>
</div>

<script>
let users={"NV0001":"U.LAKSHMI SAHANA","NV0002":"K.MAANVI","NV0003":"K.POORNA VAISHNAVI","NV5001":"B.ABHINAV","KSK":"TEACHER - KSK"};
let qs=[],idx=0,answers={},reviewSet=new Set(),timerInt=null,left=0,curLevel="";
function login(){let u=document.getElementById('u').value.trim().toUpperCase();let p=document.getElementById('p').value.trim();if((u==="KSK"&&p==="2013")||(users[u]&&p===u)){document.getElementById('loginBox').classList.add('hidden');document.getElementById('levelBox').classList.remove('hidden');document.getElementById('welcome').innerText="Welcome "+users[u];showLevels();}else alert("Wrong Username / Password!");}
function logout(){location.reload()}
function showLevels(){let lv=[["KID","KID LEVEL - 50 Qs - 10 Min - + / -","#22c55e"],["LEVEL 1","LEVEL 1 - 100 Qs - 10 Min - + / -","#16a34a"],["LEVEL 2","LEVEL 2 - 100 Qs - 10 Min - + / -","#2563eb"],["LEVEL 3","LEVEL 3 - 100 Qs - 10 Min - + / -","#f59e0b"],["LEVEL 4","LEVEL 4 - 150 Qs - 12 Min - + - ×","#ef4444"],["LEVEL 5","LEVEL 5 - 150 Qs - 12 Min - + - × ÷","#9333ea"]];document.getElementById('levels').innerHTML=lv.map(x=>`<div class="level" style="background:${x[2]}" onclick="startExam('${x[0]}')">${x[1]} →</div>`).join('');}
function rnd(n){return Math.floor(Math.random()*n)+1}
function getTotal(level){if(level==="KID")return 50; if(level==="LEVEL 1"||level==="LEVEL 2"||level==="LEVEL 3")return 100; return 150;}
function getTime(level){if(level==="LEVEL 4"||level==="LEVEL 5")return 12*60; return 10*60;}
function genOneVertical(level){
 let lines=[],total=0,max=9; if(level==="KID")max=9; else if(level==="LEVEL 1")max=20; else if(level==="LEVEL 2")max=50; else max=99;
 let first=rnd(max); if(level==="KID") first=5+rnd(5); total=first; lines.push(`${first}`);
 for(let i=1;i<4;i++){let isMinus=Math.random()<0.35;let n=rnd(max);if(level==="KID") n=rnd(9);if(isMinus){if(n>total) n=rnd(Math.max(1,total));if(n===0) n=1;total-=n;lines.push(`-${n}`);}else{total+=n;lines.push(`${n}`);}}
 return {lines,ans:total,isHorizontal:false};
}
function genQs(level){
 let totalQ=getTotal(level),set=new Set(),arr=[];
 while(arr.length<totalQ){
  let q;
  if(level==="LEVEL 4"){
   if(Math.random()<0.5){q=genOneVertical(level);}
   else {let a=2+rnd(8), b=2+rnd(9); q={lines:[`${a} x ${b}`],ans:a*b,isHorizontal:true};}
  } else if(level==="LEVEL 5"){
   let r=Math.random();
   if(r<0.34){q=genOneVertical(level);}
   else if(r<0.67){let a=2+rnd(8), b=2+rnd(9); q={lines:[`${a} x ${b}`],ans:a*b,isHorizontal:true};}
   else {let b=2+rnd(8), ans=2+rnd(9), a=b*ans; q={lines:[`${a} ÷ ${b}`],ans:ans,isHorizontal:true};}
  } else { q=genOneVertical(level); }
  let key=q.lines.join(","); if(set.has(key)) continue; set.add(key); arr.push(q);
 }
 return arr;
}
function startExam(level){curLevel=level;qs=genQs(level);idx=0;answers={};reviewSet=new Set();left=getTime(level);document.getElementById('loginBox').classList.add('hidden');document.getElementById('levelBox').classList.add('hidden');document.getElementById('examBox').classList.remove('hidden');document.getElementById('examTitle').innerText="Final NOV 2026 - "+level;document.getElementById('secLabel').innerText=level;document.getElementById('result').innerText="";startCamera();render();startTimer();}
function startCamera(){let v=document.getElementById('cam');v.style.display="block";document.getElementById('camLabel').style.display="block";if(navigator.mediaDevices) navigator.mediaDevices.getUserMedia({video:true}).then(s=>v.srcObject=s).catch(e=>{});}
function render(){
 document.getElementById('qnums').innerHTML=qs.map((_,i)=>{let cls="";if(reviewSet.has(i))cls="review";else if(answers[i]!=null&&answers[i]!=="")cls="done";return `<div class="${cls} ${i===idx?'now':''}" onclick="goQ(${i})">${i+1}</div>`;}).join('');
 document.getElementById('qNo').innerText="Question No. "+(idx+1);
 document.getElementById('totalQ').innerText=" / Total: "+qs.length;
 let q=qs[idx];
 document.getElementById('qbox').className="qbox"+(q.isHorizontal?" horizontal":"");
 document.getElementById('qtext').innerText=q.isHorizontal?q.lines[0]+" = ?":q.lines.join("\n");
 document.getElementById('ans').value=answers[idx]??"";
 let el=document.querySelectorAll('.qnums div')[idx]; if(el) el.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});
}
function press(d){let a=document.getElementById('ans'); if(a.value.length<5) a.value+=d;}
function backspace(){let a=document.getElementById('ans'); a.value=a.value.slice(0,-1);}
function clearAns(){document.getElementById('ans').value=""; delete answers[idx]; render();}
function goQ(i){saveAns();idx=i;render();}
function saveAns(){let v=document.getElementById('ans').value.trim();if(v!=="")answers[idx]=v;else delete answers[idx];}
function saveNext(){saveAns();if(reviewSet.has(idx)) reviewSet.delete(idx); if(idx<qs.length-1){idx++;render();}else alert("Last Question - Submit nokkandi!");}
function markReview(){saveAns();if(reviewSet.has(idx))reviewSet.delete(idx);else reviewSet.add(idx);render();if(idx<qs.length-1){idx++;render();}}
function startTimer(){clearInterval(timerInt);timerInt=setInterval(()=>{left--;let m=Math.floor(left/60),s=left%60;document.getElementById('timer').innerText=`Time Left: ${m<10?'0':''}${m}:${s<10?'0':''}${s} - ${curLevel} - Total ${qs.length}`;if(left<=0){clearInterval(timerInt);submitExam(true);}},1000);}
function submitExam(auto=false){saveAns();clearInterval(timerInt);let c=0;qs.forEach((q,i)=>{if(parseInt(answers[i])===q.ans)c++;});document.getElementById('result').innerHTML=`🎉 Result: ${c} / ${qs.length}`;if(confirm(`Submit cheyala? Result: ${c} / ${qs.length}`)) alert(`Result: ${c} / ${qs.length}`);}
function backLevels(){clearInterval(timerInt);document.getElementById('cam').style.display="none";document.getElementById('camLabel').style.display="none";document.getElementById('examBox').classList.add('hidden');document.getElementById('levelBox').classList.remove('hidden');}
</script></body></html>
